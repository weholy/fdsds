name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Build .app (no signing)
        run: |
          set -eo pipefail
          xcodebuild \
            -project Saver.xcodeproj \
            -scheme Saver \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.seyats.saver \
            build 2>&1 | tee build.log

      - name: Verify .app bundle
        run: |
          APP_PATH=$(find DerivedData -name "Saver.app" -path "*/Build/Products/Release-iphoneos/*" | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "Found app: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found in DerivedData!"
            find DerivedData -name "*.app" 2>/dev/null || true
            exit 1
          fi
          # Verify Info.plist exists inside the bundle
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist missing from .app bundle!"
            ls -la "$APP_PATH/" || true
            exit 1
          fi
          echo "Bundle size: $(du -sh "$APP_PATH" | cut -f1)"

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r "${{ env.APP_PATH }}" Payload/Saver.app
          zip -r Saver.ipa Payload
          rm -rf Payload
          ls -lh Saver.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saver-IPA
          path: Saver.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
