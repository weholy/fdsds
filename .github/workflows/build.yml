name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Resolve SPM packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Saver.xcodeproj \
            -scheme Saver

      - name: Build .app (no signing)
        run: |
          xcodebuild \
            -project Saver.xcodeproj \
            -scheme Saver \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.seyats.saver \
            build

      - name: Package into IPA
        run: |
          APP_PATH=$(find DerivedData -name "*.app" | grep -v simulator | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Saver.app
          zip -r Saver.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saver-IPA
          path: Saver.ipa
          retention-days: 30

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Saver.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
